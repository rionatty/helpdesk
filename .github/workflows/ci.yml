name: CI

# Fast checks on every push: does the desk app still build, does the Python
# still compile, do the offline tests pass. The point is to fail loudly here,
# before a deploy, instead of during one on the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build desk app
    runs-on: ubuntu-latest
    steps:
      # Lay the repo out like a bench - apps/helpdesk beside sites/ - because
      # the desk imports ../../../../sites/common_site_config.json at build
      # time (src/socket.ts reads socketio_port from it).
      - uses: actions/checkout@v4
        with:
          path: apps/helpdesk

      # The desk also imports frappe's vendored analytics library
      # (src/telemetry.ts -> ../../../frappe/frappe/public/js/lib/posthog.js),
      # which lives in the frappe app beside this one. Fetch just that.
      - name: Frappe framework files the desk imports
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-16
          path: apps/frappe
          sparse-checkout: frappe/public/js/lib/posthog.js
          sparse-checkout-cone-mode: false

      - name: Stand-in bench site config
        run: |
          mkdir -p sites
          echo '{"socketio_port": 9000}' > sites/common_site_config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: apps/helpdesk/desk/yarn.lock

      # Same steps `bench build --app helpdesk` runs on the server.
      - name: Install
        working-directory: apps/helpdesk/desk
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: apps/helpdesk/desk
        run: yarn build

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Every module compiles
        run: python -m compileall -q helpdesk

      - name: Offline tests (no Frappe needed)
        run: python -m unittest discover -s tests_offline -v
